[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprintmaster"
version = "0.1.0"
description = "CLI tool that decomposes feature descriptions into structured agile tickets using AWS Lambda + Bedrock (Claude 3 Haiku)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "rich>=13.0",
    "rich-argparse>=1.4",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
sprintmaster = "sprintmaster.cli:main"

[tool.setuptools.packages.find]
include = ["sprintmaster*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
